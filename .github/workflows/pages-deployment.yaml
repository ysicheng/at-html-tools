name: Deploy to Cloudflare Pages

on:
  # Only main produces the production deployment.
  push:
    branches:
      - main
  # Each pull request gets an isolated Cloudflare Pages preview deployment.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  # Cancel only an obsolete deployment for the same target; previews do not block production.
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=at-html-tools --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
